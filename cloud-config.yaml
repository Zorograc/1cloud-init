#cloud-config
package_update: true
packages:
  - nginx
  - python3-flask
  - postgresql
  - python3-psycopg2
  - redis-server
  - python3-redis
  - apache2-utils
write_files:
  - path: /var/www/html/index.html
    content: |
      Dela
runcmd:
  - systemctl enable --now nginx
  - systemctl enable --now postgresql
  - systemctl enable --now redis-server
