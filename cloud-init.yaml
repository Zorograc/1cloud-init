#cloud-config
package_update: true

packages:
  - nginx
  - python3-flask
  - postgresql
  - python3-psycopg2
  - redis-server
  - python3-redis

write_files:
  - path: /opt/devops/app.py
    owner: root:root
    permissions: '0644'
    content: |
      from flask import Flask, jsonify, render_template_string, request
      import psycopg2
      import redis
      import json

      app = Flask(__name__)
      cache = redis.Redis(host = "127.0.0.1", port = 6379, decode_responses = True)

      def get_messages():
          cached = cache.get("messages")
          if cached is not None:
              return json.loads(cached)

          conn = psycopg2.connect(dbname="devops")
          try:
              with conn.cursor() as cursor:
                  cursor.execute("SELECT id, content FROM messages ORDER BY id")
                  messages = cursor.fetchall()
                  cache.set("messages", json.dumps(messages))
                  return messages
          finally:
              conn.close()


      def save_message(content):
          conn = psycopg2.connect(dbname="devops")
          try:
              with conn.cursor() as cursor:
                  cursor.execute(
                      "INSERT INTO messages (content) VALUES (%s)",
                      (content,)
                  )
                  conn.commit()
                  cache.delete("messages")
          finally:
              conn.close()


      def message_content():
          data = request.get_json(silent=True)
          if not isinstance(data, dict):
              return None

          content = data.get("content")
          if not isinstance(content, str) or not content.strip():
              return None
          return content.strip()


      @app.route("/", methods=["GET", "POST"])
      def home():
          if request.method == "GET":
              return render_template_string("""
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Entries</title>
        <style>
          :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17211d;
            background: #f3f6f2;
            font-synthesis: none;
          }
          * { box-sizing: border-box; }
          body { margin: 0; min-height: 100vh; }
          main { width: min(100% - 32px, 720px); margin: 0 auto; padding: 72px 0; }
          .eyebrow { margin: 0 0 10px; color: #527461; font-size: .75rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
          h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 3.5rem); letter-spacing: -.055em; line-height: 1; }
          .intro { margin: 14px 0 32px; color: #63716a; }
          .composer, .entry { border: 1px solid #e1e8e1; border-radius: 16px; background: #fff; box-shadow: 0 8px 28px #20352a0a; }
          .composer { padding: 20px; }
          label { display: block; margin-bottom: 10px; font-size: .9rem; font-weight: 650; }
          textarea { display: block; width: 100%; min-height: 100px; resize: vertical; border: 1px solid #d5ded6; border-radius: 10px; padding: 12px 14px; color: inherit; font: inherit; line-height: 1.5; }
          textarea:focus { border-color: #3c7955; outline: 3px solid #3c795522; }
          .form-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 14px; }
          button { border: 0; border-radius: 9px; padding: 11px 17px; background: #23613d; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
          button:hover { background: #194d30; }
          button:disabled { cursor: wait; opacity: .65; }
          #status { min-height: 1.25em; color: #a13e37; font-size: .875rem; }
          h2 { margin: 38px 0 14px; font-size: 1.1rem; }
          #entries { display: grid; gap: 10px; }
          .entry { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; }
          .entry-number { display: grid; flex: 0 0 30px; width: 30px; height: 30px; place-items: center; border-radius: 50%; background: #eef4ee; color: #42634d; font-size: .8rem; font-weight: 700; }
          .entry-content { margin: 4px 0 0; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
          .empty { margin: 0; padding: 22px; border: 1px dashed #cbd6cc; border-radius: 12px; color: #718078; text-align: center; }
          @media (max-width: 520px) { main { padding: 44px 0; } .composer { padding: 16px; } .form-footer { align-items: flex-start; flex-direction: column; } }
        </style>
      </head>
      <body>
        <main>
          <h1>Entries</h1>
          <form class="composer" id="entry-form">
            <label for="content">New entry</label>
            <textarea id="content" name="content" placeholder="Entry" required maxlength="10000"></textarea>
            <div class="form-footer">
              <span id="status" role="status" aria-live="polite"></span>
              <button id="submit" type="submit">Add entry</button>
            </div>
          </form>
          <section aria-labelledby="entries-heading">
            <h2 id="entries-heading">All entries</h2>
            <div id="entries" aria-live="polite"><p class="empty">Loading entries…</p></div>
          </section>
        </main>
        <script>
          const form = document.querySelector("#entry-form");
          const input = document.querySelector("#content");
          const submit = document.querySelector("#submit");
          const status = document.querySelector("#status");
          const entries = document.querySelector("#entries");

          function renderEntries(items) {
            entries.replaceChildren();
            if (items.length === 0) {
              const empty = document.createElement("p");
              empty.className = "empty";
              empty.textContent = "No entries yet. Add your first one above.";
              entries.append(empty);
              return;
            }

            for (const [id, content] of items) {
              const article = document.createElement("article");
              article.className = "entry";
              const number = document.createElement("span");
              number.className = "entry-number";
              number.textContent = id;
              const text = document.createElement("p");
              text.className = "entry-content";
              text.textContent = content;
              article.append(number, text);
              entries.append(article);
            }
          }

          async function loadEntries() {
            const response = await fetch("/api/messages");
            if (!response.ok) throw new Error("Could not load entries.");
            renderEntries(await response.json());
          }

          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            status.textContent = "";
            submit.disabled = true;
            try {
              const response = await fetch("/api/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: input.value })
              });
              if (!response.ok) {
                const result = await response.json();
                throw new Error(result.error || "Could not save entry.");
              }
              input.value = "";
              await loadEntries();
            } catch (error) {
              status.textContent = error.message || "Something went wrong.";
            } finally {
              submit.disabled = false;
            }
          });

          loadEntries().catch((error) => {
            entries.replaceChildren();
            status.textContent = error.message || "Could not load entries.";
          });
        </script>
      </body>
      </html>
      """)

          content = message_content()
          if content is None:
              return jsonify(error="Content must be a non-empty string"), 400
          save_message(content)
          return jsonify(message="Sporočilo shranjeno")


      @app.route("/api/messages", methods=["GET", "POST"])
      def messages_api():
          if request.method == "GET":
              return jsonify(get_messages())

          content = message_content()
          if content is None:
              return jsonify(error="Content must be a non-empty string"), 400
          save_message(content)
          return jsonify(message="Sporočilo shranjeno"), 201

  - path: /opt/devops/db.sql
    owner: root:root
    permissions: '0644'
    content: |
      CREATE TABLE IF NOT EXISTS messages (
          id SERIAL PRIMARY KEY,
          content TEXT NOT NULL
      );

  - path: /opt/devops/devops.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      After=network.target

      [Service]
      User=www-data
      WorkingDirectory=/opt/devops
      ExecStart=/usr/bin/python3 -m flask --app app run --host=127.0.0.1 --port=5000
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

  - path: /opt/devops/nginx.conf
    owner: root:root
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          server_name _;

          auth_basic "DevOps";
          auth_basic_user_file /etc/nginx/.htpasswd;

          location / {
              proxy_pass http://127.0.0.1:5000;
          }
      }

  - path: /opt/devops/.htpasswd
    owner: root:root
    permissions: '0600'
    content: |
      devops:$6$xpKN5uBeG6p0i3y5$m18Mvqa8iWjXbvRVql52C/37i.nxG27FGiSVtX9O6WTA3xOhIWGoqv04mDWrVv9vv4T/2ld1RVyTClDJ/vKfB.

runcmd:
  - |
    set -eu

    # Zaženi podatkovno bazo in Redis.
    systemctl enable --now postgresql redis-server

    # Ustvari PostgreSQL uporabnika, če še ne obstaja.
    if ! runuser -u postgres -- psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='www-data'" | grep -qx 1; then
      runuser -u postgres -- createuser www-data
    fi

    # Ustvari bazo.
    if ! runuser -u postgres -- psql -tAc "SELECT 1 FROM pg_database WHERE datname='devops'" | grep -qx 1; then
      runuser -u postgres -- createdb -O www-data devops
    fi

    # Ustvari tabelo iz db.sql.
    runuser -u www-data -- psql -d devops -v ON_ERROR_STOP=1 -f /opt/devops/db.sql

    # Namesti konfiguracije.
    install -m 0644 /opt/devops/devops.service /etc/systemd/system/devops.service
    install -m 0644 /opt/devops/nginx.conf /etc/nginx/sites-available/default
    install -o root -g www-data -m 0640 /opt/devops/.htpasswd /etc/nginx/.htpasswd

    # Zaženi Flask in Nginx.
    systemctl daemon-reload
    systemctl enable --now devops
    nginx -t
    systemctl enable --now nginx
    systemctl restart nginx